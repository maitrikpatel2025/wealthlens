[project]
name = "server"
version = "0.1.0"
description = "WealthLens — AI Portfolio Intelligence for Canadian Investors"
authors = [
    {name = "developer", email = "dev@example.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "copilotkit (>=0.1.52,<0.2.0)",
    "ag-ui-protocol (>=0.1.7,<0.2.0)",
    "fastapi (>=0.115.14,<0.116.0)",
    "uvicorn (>=0.35.0,<0.36.0)",
    "langchain-gemini (>=0.1.1,<0.2.0)",
    "yfinance (>=0.2.64,<0.3.0)",
    "langchain-openai (>=0.3.27,<0.4.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "pandas (>=2.3.0,<3.0.0)",
    "langchain[google-genai] (>=0.3.26,<0.4.0)",
    "lxml (>=6.0.0,<7.0.0)",
    "tavily-python (>=0.7.9,<0.8.0)",
    "httpx (>=0.27.0,<0.28.0)",
    "pdfplumber (>=0.11.0,<0.12.0)",
    "python-multipart (>=0.0.6,<0.1.0)",
    "sqlmodel (>=0.0.22,<0.1.0)",
    "alembic (>=1.14.0,<2.0.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "aiosqlite (>=0.20.0,<0.21.0)",
    "redis (>=5.2.0,<6.0.0)",
    "boto3 (>=1.35.0,<2.0.0)",
    "pyjwt (>=2.9.0,<3.0.0)",
    "pymupdf (>=1.27.2,<2.0.0)",
    "numpy (>=1.26.0,<3.0.0)"
]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
